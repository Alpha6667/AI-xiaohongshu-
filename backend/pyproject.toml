[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-xiaohongshu-backend"
version = "0.1.0"
description = "FastAPI backend for AI Xiaohongshu posting platform"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0"
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["."]
